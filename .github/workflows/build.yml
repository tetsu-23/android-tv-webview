name: Build Glance TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release APK
        run: cd com.tetsu.glance_tv_project && gradle assembleDebug assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.tetsu.glance-tv-apk
          path: |
            com.tetsu.glance_tv_project/app/build/outputs/apk/debug/*.apk
            com.tetsu.glance_tv_project/app/build/outputs/apk/release/*.apk
